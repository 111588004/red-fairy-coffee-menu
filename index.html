<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紅仙水 HAND DRIP COFFEE - 單品手沖咖啡價目表 (直火極簡品牌旗艦版)</title>
  
  <!-- 載入各風格樣式表 -->
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./theme-canva.css">
  <link rel="stylesheet" href="./theme-hybrid.css">
  <link rel="stylesheet" href="./theme-pages.css">
</head>
<body class="theme-wine-brand mode-a4">

  <!-- 頂部互動控制列（螢幕顯示，列印時自動隱藏） -->
  <header class="controls-toolbar" aria-label="版面控制列">
    
    <!-- 品牌版本標籤 (現役核定定版) -->
    <div class="toolbar-group">
      <span class="badge-fixed-version">
        <span class="version-dot"></span>
        現行定版：嚴選 9 款 (含世界冠軍豆)
      </span>
    </div>

    <!-- 檢視模式切換 -->
    <div class="toolbar-group">
      <span class="toolbar-label" id="label-mode">檢視模式：</span>
      <div class="segmented-control" role="group" aria-labelledby="label-mode">
        <button type="button" class="seg-btn active" id="btn-mode-a4" aria-pressed="true" onclick="setViewMode('a4')">📄 A4 大字版</button>
        <button type="button" class="seg-btn" id="btn-mode-cont" aria-pressed="false" onclick="setViewMode('continuous')">📱 連續捲動 (手機友好)</button>
      </div>
    </div>

    <!-- 每頁品項數控制 -->
    <div class="toolbar-group" id="group-items-per-page">
      <label for="select-items-per-page" class="toolbar-label">每頁：</label>
      <select id="select-items-per-page" class="select-input" onchange="changeItemsPerPage(this.value)">
        <option value="4">4 款 / 頁</option>
        <option value="5" selected>5 款 / 頁 (標準推薦)</option>
        <option value="6">6 款 / 頁</option>
      </select>
    </div>

    <!-- 📦 歷史封存樣板入口 (Archive) -->
    <div class="toolbar-group">
      <label for="select-archive" class="toolbar-label">樣板：</label>
      <select id="select-archive" class="select-input archive-select" onchange="handleArchiveSelect(this.value)">
        <option value="wine-brand" selected>👑 現行定版 (酒紅品牌版)</option>
        <optgroup label="📦 歷史封存樣板 (Archive)">
          <option value="wine">🍷 風格一：經典酒紅雅致</option>
          <option value="canva">📜 風格二：Canva 原版二欄 (12款)</option>
          <option value="hybrid">✨ 風格三：直火極簡三欄 (品牌旗艦)</option>
        </optgroup>
      </select>
    </div>

    <!-- ⚡ 指令修改台按鈕 (其他通路指令入口) -->
    <div class="toolbar-group">
      <button type="button" class="btn-command" onclick="toggleCommandConsole()" aria-label="開啟指令修改台">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        指令修改台
      </button>
    </div>

    <!-- 列印按鈕 -->
    <div class="toolbar-group">
      <button type="button" class="btn-print" onclick="window.print()" aria-label="列印或另存為 PDF 文件">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        列印 / 另存 PDF
      </button>
    </div>
  </header>

  <!-- ⚡ 指令修改台抽屜面板 (Command Console Modal / Drawer) -->
  <aside id="command-console-drawer" class="cmd-drawer" aria-hidden="true">
    <div class="cmd-drawer-backdrop" onclick="toggleCommandConsole(false)"></div>
    <div class="cmd-drawer-content">
      <div class="cmd-drawer-header">
        <div class="cmd-title-wrap">
          <span class="cmd-icon">⚡</span>
          <h3>紅仙水 菜單指令調控台</h3>
        </div>
        <button type="button" class="cmd-btn-close" onclick="toggleCommandConsole(false)" aria-label="關閉指令台">✕</button>
      </div>

      <div class="cmd-drawer-body">
        <p class="cmd-hint">
          直接輸入指令快速修改菜單（支援修改價格、焙度、可拿鐵開關、備註等），按下執行即刻在上方畫布即時渲染！
        </p>

        <!-- 指令範本捷徑 -->
        <div class="cmd-shortcuts">
          <span class="cmd-sc-label">快速指令範例：</span>
          <button type="button" class="cmd-chip" onclick="applyExampleCmd('set-price 4 cup 180')">修改冠軍豆單杯 180</button>
          <button type="button" class="cmd-chip" onclick="applyExampleCmd('set-latte 8 true')">開啟第8款桃可可拿鐵</button>
          <button type="button" class="cmd-chip" onclick="applyExampleCmd('set-roast 1 中淺焙')">改第1款焙度為中淺焙</button>
        </div>

        <div class="cmd-input-wrap">
          <label for="cmd-textarea" class="cmd-label">指令輸入框（每行一條指令，或貼上 JSON / 自然指令）：</label>
          <textarea id="cmd-textarea" class="cmd-textarea" rows="4" placeholder="例如：&#10;set-price 4 cup 180&#10;set-latte 8 true&#10;set-price 1 beans 480"></textarea>
        </div>

        <div class="cmd-actions">
          <button type="button" class="btn-cmd-exec" onclick="executeCommands()">🚀 執行指令並即時預覽</button>
          <button type="button" class="btn-cmd-reset" onclick="resetDefaultData()">↺ 重設回原始核定版</button>
          <button type="button" class="btn-cmd-export" onclick="exportDataJs()">📋 匯出最新 data.js</button>
        </div>

        <!-- 執行狀態回饋 -->
        <div id="cmd-log" class="cmd-log" style="display:none;"></div>
      </div>
    </div>
  </aside>

  <!-- A4 分頁舞台容器（由 data.js 動態渲染生成） -->
  <main class="pages-stage" id="pages-stage" role="main"></main>

  <!-- 載入菜單資料庫（無 CORS 限制，雙擊直接開啟） -->
  <script src="./data.js"></script>

  <!-- 三風格雙資料集渲染引擎與指令調控台 -->
  <script>
    let currentTheme = 'wine-brand'; // 預設現行定版：'wine-brand'
    let currentDataset = 'curated'; // 預設核定 9 款：'curated'
    let currentMode = 'a4'; // 'a4' | 'continuous'
    let itemsPerPage = 5;

    // 備份初始數據供重設使用
    let initialCoffeeMenuData = null;
    function backupInitialData() {
      if (!initialCoffeeMenuData && window.COFFEE_MENU_DATA) {
        initialCoffeeMenuData = JSON.parse(JSON.stringify(window.COFFEE_MENU_DATA));
      }
    }

    function setTheme(theme) {
      currentTheme = theme;
      document.body.className = `theme-${theme} ${currentMode === 'a4' ? 'mode-a4' : 'mode-continuous'}`;
      
      const selectArchive = document.getElementById('select-archive');
      if (selectArchive) {
        selectArchive.value = theme;
      }
      
      // 自動切換合適的每頁數量
      if (theme === 'canva') {
        itemsPerPage = 6;
        const sel = document.getElementById('select-items-per-page');
        if (sel) sel.value = '6';
      } else {
        itemsPerPage = 5;
        const sel = document.getElementById('select-items-per-page');
        if (sel) sel.value = '5';
      }
      
      renderPages();
    }

    function handleArchiveSelect(theme) {
      if (theme === 'canva') {
        currentDataset = 'canva';
      } else {
        currentDataset = 'curated';
      }
      setTheme(theme);
    }

    function changeDataset(val) {
      currentDataset = val;
      renderPages();
    }

    // ==========================================
    // ⚡ 指令修改台 (Command Console Engine)
    // ==========================================
    function toggleCommandConsole(force) {
      const drawer = document.getElementById('command-console-drawer');
      if (!drawer) return;
      const isOpen = (typeof force === 'boolean') ? force : !drawer.classList.contains('open');
      drawer.classList.toggle('open', isOpen);
      drawer.setAttribute('aria-hidden', (!isOpen).toString());
      if (isOpen) {
        backupInitialData();
        document.getElementById('cmd-textarea').focus();
      }
    }

    function applyExampleCmd(cmd) {
      const ta = document.getElementById('cmd-textarea');
      if (!ta) return;
      ta.value = cmd;
      executeCommands();
    }

    function logCmd(msg, isSuccess = true) {
      const logBox = document.getElementById('cmd-log');
      if (!logBox) return;
      logBox.style.display = 'block';
      logBox.style.color = isSuccess ? '#4ade80' : '#f87171';
      logBox.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    }

    // ==============================================================================
    // ⚡ 智能自然語言指令調控台 (Smart NLP Command Engine)
    // ==============================================================================
    function executeCommands() {
      backupInitialData();
      const ta = document.getElementById('cmd-textarea');
      if (!ta || !ta.value.trim()) return;

      const raw = ta.value.trim();
      let logs = [];
      const items = window.COFFEE_MENU_DATA.items;

      // 支援 A：若輸入是完整 JSON，直接覆蓋菜單資料
      if (raw.startsWith('{') && raw.endsWith('}')) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed.items) {
            window.COFFEE_MENU_DATA = parsed;
            renderPages();
            logCmd('✅ 成功導入完整 JSON 菜單數據！');
            return;
          }
        } catch (e) {
          // 不是單一 json，繼續以自然語言/指令解析
        }
      }

      // 輔助函式：根據名稱或編號查找品項
      function findItem(query) {
        if (!query) return null;
        const q = String(query).trim().toLowerCase().replace(/號|款|第/g, '');
        return items.find(it => 
          it.id === q || 
          it.name.toLowerCase().includes(q) || 
          (it.dotName && it.dotName.toLowerCase().includes(q))
        );
      }

      // 輔助函式：從字串提取所有品項 ID（支援「1、3、4、5」、「1,2,3」、「2345679」、「1 2 3」）
      function extractItemIds(str) {
        let matchedIds = new Set();
        // 情況 1：連寫數字例如 2345679 或 1345
        const compactNumMatch = str.match(/\b([1-9]{2,9})\b/);
        if (compactNumMatch) {
          compactNumMatch[1].split('').forEach(n => matchedIds.add(n));
        }
        // 情況 2：頓號/逗號/空格隔開的數字，例如 1、3、4、5 或 1, 3, 4, 5
        const tokens = str.split(/[、,，\s\+與和]+/);
        tokens.forEach(t => {
          const clean = t.replace(/第|款|號/g, '').trim();
          if (/^[1-9]$/.test(clean)) {
            matchedIds.add(clean);
          } else {
            const it = findItem(clean);
            if (it) matchedIds.add(it.id);
          }
        });
        return Array.from(matchedIds);
      }

      // 拆分子句：以換行、分號、句號切割
      const rawSentences = raw.split(/[\n;；。]+/).map(s => s.trim()).filter(Boolean);

      rawSentences.forEach(sentence => {
        // ----------------------------------------------------
        // 場景 1：拿鐵相關指令 (支援「1、3、4、5 改成拿鐵，其他不要拿鐵」)
        // ----------------------------------------------------
        if (/拿鐵|latte/i.test(sentence)) {
          // 檢查是否包含「其他不要 / 其餘不要」
          const hasOtherNegative = /其他.*(不要|不可|不能|取消|關閉)|其餘.*(不要|不可|不能|取消|關閉)/.test(sentence);

          // 切分成前後半段（例如「1、3、4、5 改成拿鐵」與「其他不要拿鐵」）
          const clauses = sentence.split(/[，,]/).map(c => c.trim()).filter(Boolean);

          clauses.forEach(clause => {
            const isNegative = /不要|不能|不可|取消|關閉|off|false/i.test(clause);
            const isAll = /全部|所有人|大家|通通/i.test(clause);
            const isOther = /其他|其餘/i.test(clause);

            if (isAll) {
              items.forEach(it => it.canLatte = !isNegative);
              logs.push(`✓ 已將【全部品項】可拿鐵改為：${!isNegative ? '開啟 [可拿鐵]' : '關閉'}`);
            } else if (isOther && isNegative) {
              // 其他不要拿鐵：已在正向處理時被排除，維持當前設定
            } else {
              const targetIds = extractItemIds(clause);
              if (targetIds.length > 0) {
                targetIds.forEach(id => {
                  const it = items.find(item => item.id === id);
                  if (it) it.canLatte = !isNegative;
                });
                logs.push(`✓ [品項 ${targetIds.join(', ')}] 已設定為：${!isNegative ? '開啟 [可拿鐵]' : '關閉拿鐵'}`);
                
                // 若這句同時帶有「其他不要拿鐵」，自動將其餘品項關閉
                if (hasOtherNegative && !isNegative) {
                  items.forEach(it => {
                    if (!targetIds.includes(it.id)) it.canLatte = false;
                  });
                  logs.push(`✓ 其餘品項已全部自動設為【不含拿鐵】`);
                }
              }
            }
          });
          return;
        }

        // ----------------------------------------------------
        // 場景 2：價格修改 (支援「肯亞 單杯 180」、「4 熟豆改 650」)
        // ----------------------------------------------------
        const priceMatch = sentence.match(/(?:改|設|為|成|\$)?\s*(\d{2,4})\s*(?:元)?/);
        if (priceMatch && !/^[1-9]$/.test(priceMatch[1])) {
          const priceVal = parseInt(priceMatch[1], 10);
          // 找出品項
          let matchedItem = null;
          for (let it of items) {
            if (sentence.includes(it.id) || sentence.includes(it.name) || (it.dotName && sentence.includes(it.dotName))) {
              matchedItem = it;
              break;
            }
          }
          // 嘗試提取品項開頭編號
          if (!matchedItem) {
            const idM = sentence.match(/(?:第)?([1-9])(?:款|號)?/);
            if (idM) matchedItem = items.find(it => it.id === idM[1]);
          }

          if (matchedItem) {
            if (/熟豆|200g|豆/i.test(sentence)) {
              matchedItem.beansPrice200g = priceVal;
              logs.push(`✓ [品項 ${matchedItem.id}] ${matchedItem.name}：熟豆 200g 價格改為 $${priceVal}`);
            } else if (/濾掛|掛|10包|12g/i.test(sentence)) {
              matchedItem.dripPrice10pk = priceVal;
              logs.push(`✓ [品項 ${matchedItem.id}] ${matchedItem.name}：濾掛 10包 價格改為 $${priceVal}`);
            } else {
              // 預設為單杯價格
              matchedItem.cupPrice = priceVal;
              logs.push(`✓ [品項 ${matchedItem.id}] ${matchedItem.name}：單杯手沖價格改為 $${priceVal}`);
            }
            return;
          }
        }

        // ----------------------------------------------------
        // 場景 3：焙度修改 (支援「1 號改淺中焙」、「耶加 淺焙」)
        // ----------------------------------------------------
        const roastMatch = sentence.match(/(極淺焙|淺中焙|中深焙|淺焙|中焙|深焙)/);
        if (roastMatch) {
          const roastVal = roastMatch[1];
          const targetIds = extractItemIds(sentence);
          if (targetIds.length > 0) {
            targetIds.forEach(id => {
              const it = items.find(item => item.id === id);
              if (it) it.roast = roastVal;
            });
            logs.push(`✓ [品項 ${targetIds.join(', ')}] 焙度已改為：${roastVal}`);
            return;
          }
        }

        // ----------------------------------------------------
        // 場景 4：處理法修改 (支援「1 水洗」、「4 日曬 G1」)
        // ----------------------------------------------------
        const procMatch = sentence.match(/(水洗\s*G1|日曬\s*G1|特殊發酵水洗|雙重厭氧|酒桶浸漬日曬\s*G1|水洗|日曬|蜜處理|厭氧)/);
        if (procMatch) {
          const procVal = procMatch[1];
          const targetIds = extractItemIds(sentence);
          if (targetIds.length > 0) {
            targetIds.forEach(id => {
              const it = items.find(item => item.id === id);
              if (it) it.process = procVal;
            });
            logs.push(`✓ [品項 ${targetIds.join(', ')}] 處理法已改為：${procVal}`);
            return;
          }
        }

        // ----------------------------------------------------
        // 場景 5：傳統命令相容 (set-price, set-latte, set-roast)
        // ----------------------------------------------------
        const parts = sentence.split(/\s+/);
        const action = parts[0].toLowerCase();
        if (action === 'set-price') {
          const target = parts[1];
          const type = parts[2] ? parts[2].toLowerCase() : 'cup';
          const val = parseInt(parts[3], 10);
          const item = findItem(target);
          if (item && !isNaN(val)) {
            if (type === 'cup') item.cupPrice = val;
            else if (type === 'beans') item.beansPrice200g = val;
            else if (type === 'drip') item.dripPrice10pk = val;
            logs.push(`✓ [品項 ${item.id}] ${item.name}：${type} 價格改為 $${val}`);
          }
        } else if (action === 'set-latte') {
          const target = parts[1];
          const flag = ['true', 'on', '1', 'yes'].includes(String(parts[2]).toLowerCase());
          const item = findItem(target);
          if (item) {
            item.canLatte = flag;
            logs.push(`✓ [品項 ${item.id}] ${item.name}：拿鐵改為 ${flag ? '開啟' : '關閉'}`);
          }
        }
      });

      renderPages();
      if (logs.length > 0) {
        logCmd('🚀 執行成功：\n' + logs.join('\n'));
      } else {
        logCmd('⚠️ 未能識別出變更指令，請嘗試例如：\n• 1、3、4 改成拿鐵，其他不要\n• 肯亞 單杯改 180\n• 4 號 熟豆 650', false);
      }
    }

    function resetDefaultData() {
      if (initialCoffeeMenuData) {
        window.COFFEE_MENU_DATA = JSON.parse(JSON.stringify(initialCoffeeMenuData));
        renderPages();
        logCmd('↺ 已重設回原始核定 9 款菜單數據');
      }
    }

    function exportDataJs() {
      const dataStr = 'window.COFFEE_MENU_DATA = ' + JSON.stringify(window.COFFEE_MENU_DATA, null, 2) + ';\n';
      navigator.clipboard.writeText(dataStr).then(() => {
        logCmd('📋 最新 COFFEE_MENU_DATA 已成功複製到剪貼簿！可直接貼上覆蓋 data.js');
      }).catch(() => {
        const blob = new Blob([dataStr], { type: 'application/javascript' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'data.js';
        a.click();
        logCmd('📥 已自動下載更新後的 data.js 檔案');
      });
    }

    // 支援 URL 參數通路：例如 ?cmd=set-price+4+cup+190
    window.addEventListener('DOMContentLoaded', () => {
      backupInitialData();
      const params = new URLSearchParams(window.location.search);
      const urlCmd = params.get('cmd');
      if (urlCmd) {
        const ta = document.getElementById('cmd-textarea');
        if (ta) {
          ta.value = decodeURIComponent(urlCmd);
          executeCommands();
        }
      }
      const urlTheme = params.get('theme');
      if (urlTheme) {
        setTheme(urlTheme);
      }
    });

    function setViewMode(mode) {
      currentMode = mode;
      document.body.className = `theme-${currentTheme} ${mode === 'a4' ? 'mode-a4' : 'mode-continuous'}`;
      
      const btnA4 = document.getElementById('btn-mode-a4');
      const btnCont = document.getElementById('btn-mode-cont');
      const isA4 = (mode === 'a4');
      
      btnA4.classList.toggle('active', isA4);
      btnA4.setAttribute('aria-pressed', isA4 ? 'true' : 'false');
      btnCont.classList.toggle('active', !isA4);
      btnCont.setAttribute('aria-pressed', !isA4 ? 'true' : 'false');
      
      document.getElementById('group-items-per-page').style.display = isA4 ? 'flex' : 'none';
      renderPages();
    }

    function changeItemsPerPage(val) {
      itemsPerPage = parseInt(val, 10) || 5;
      renderPages();
    }

    function getActiveData() {
      if (currentDataset === 'canva') {
        return window.CANVA_ORIGINAL_MENU_DATA || window.COFFEE_MENU_DATA;
      }
      return window.COFFEE_MENU_DATA;
    }

    function getAssetUrl(key, defaultPath) {
      if (window.MENU_ASSETS && window.MENU_ASSETS[key]) {
        return window.MENU_ASSETS[key];
      }
      return defaultPath;
    }

    function formatItemNumber(id) {
      if (id === null || id === undefined) return '';
      const str = String(id).trim();
      const num = parseInt(str, 10);
      if (!isNaN(num)) {
        return String(num);
      }
      return str;
    }

    function renderPages() {
      const stage = document.getElementById('pages-stage');
      stage.innerHTML = '';

      const data = getActiveData();
      if (!data || !data.items) return;

      const items = data.items;
      const brand = data.brand || {
        enTitle: "HAND DRIP COFFEE",
        name: "紅 仙 水",
        menuTitle: "嚴選單品手沖咖啡價目表",
        footerSlogan: "紅仙水 直火烘焙咖啡 ✦ 匠心手沖 ✦ 每週新鮮烘焙"
      };

      const isA4 = (currentMode === 'a4');
      const totalPages = isA4 ? Math.ceil(items.length / itemsPerPage) : 1;

      // 單品手沖咖啡頁面 (P.1 ~ P.2 或 連續捲動)
      if (!isA4) {
        let sheet;
        if (currentTheme === 'canva') {
          sheet = createCanvaSheetElement(items, 1, totalPages, false, brand);
        } else if (currentTheme === 'hybrid') {

      } else {

          let sheet;
          if (currentTheme === 'canva') {

                <img src="${imgAm}" alt="${escapeHtml(itemAm.name)}">
                <div class="drink-price-bubble bubble-americano">${escapeHtml(itemAm.price)}</div>
              </div>
              <div class="drink-banner-brown drink-banner-americano">${escapeHtml(itemAm.name)}</div>
              <div class="drink-sub-americano">${escapeHtml(itemAm.enName || '')}</div>
            </div>

            <!-- 抹茶奶蓋 / MATCHA LATTE -->
            <div class="drink-photo-card" style="margin-top: 10px;">
              <div class="drink-photo-frame drink-photo-frame-matcha">
                <img src="${imgMa}" alt="${escapeHtml(itemMa.name)}">
                <div class="drink-price-bubble bubble-matcha">${escapeHtml(itemMa.price)}</div>
              </div>
              <div class="drink-matcha-info">
                <div class="drink-banner-brown">${escapeHtml(itemMa.enName || 'MATCHA LATTE')}</div>
                <div class="drink-matcha-sub">${escapeHtml(itemMa.subName || '小山園抹茶')}</div>
              </div>
            </div>

            <!-- 熱拿鐵 HOT LATTE -->
            <div class="drink-card-latte">
              <div class="drink-photo-frame drink-photo-frame-latte">
                <img src="${imgLa}" alt="${escapeHtml(itemLa.name)}">
                <div class="drink-price-bubble bubble-latte">${escapeHtml(itemLa.price)}</div>
              </div>
              <div class="drink-latte-info">
                <div class="drink-banner-brown">${escapeHtml(itemLa.name)}</div>
                <div class="drink-latte-sub">${escapeHtml(itemLa.subName || '')}</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 水妹插畫貼紙 (置於中下方交疊處) -->
        <div class="drinks-shuimei-wrapper">
          <img src="${imgShuimei}" class="drinks-shuimei-sticker-img" alt="水妹">
          <span class="drinks-shuimei-label">水妹</span>
        </div>
      `;

      return sheet;
    }

    /* ==============================================================================
       🍞 第 4 頁：老闆推薦 今日品項 / 甜點輕食 (100% HTML & CSS 定義)
       ============================================================================== */
    function createBakerySheetElement(pageNum, totalPages, isA4) {
      const sheet = document.createElement('article');
      sheet.className = 'a4-sheet sheet-bakery';

      const pageIndicator = isA4 ? `<div class="sheet-page-indicator" style="color: #D48B3D;">第 ${pageNum} 頁 / 共 ${totalPages} 頁</div>` : '';
      const bakeryData = window.BAKERY_MENU_DATA || { items: [] };
      const items = bakeryData.items || [];
      const header = bakeryData.header || {};

      let itemsHtml = '';
      items.forEach(item => {
        const veganBadge = item.badge ? `<div class="bakery-vegan-pill">${escapeHtml(item.badge)}</div>` : '';
        const itemImg = getAssetUrl(item.imageKey, item.imageFile);
        itemsHtml += `
          <div class="bakery-item-card">
            <div class="bakery-img-box">
              ${veganBadge}
              <img src="${itemImg}" alt="${escapeHtml(item.name)}">
            </div>
            <div class="bakery-tag-pill">${escapeHtml(item.name)}</div>
            <div class="bakery-price-text">${escapeHtml(item.price)}</div>
          </div>
        `;
      });

      const imgCookies = getAssetUrl('cookieBar', './assets/cookie_bar.png');

      sheet.innerHTML = `
        ${pageIndicator}
        <header class="bakery-top-bar">
          <img src="${imgCookies}" class="bakery-cookie-img" alt="手作小餅乾裝飾條">
          <div class="bakery-cursive-sub">${escapeHtml(header.subTitle || 'fresh from the bakery!')}</div>
          <h2 class="bakery-main-title">
            <span class="bakery-title-white">${escapeHtml(header.titlePrefix || '老闆推薦')}</span>
            <span class="bakery-title-orange">${escapeHtml(header.titleHighlight || '今日品項')}</span>
          </h2>
        </header>

        <div class="bakery-grid">
          ${itemsHtml}
        </div>
      `;

      return sheet;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 初始化：預設套用現行定版（風格四：酒紅經典品牌版 - 嚴選 9 款）
    setTheme('wine-brand');
  </script>
</body>
</html>
